.x{background:none;border:0;color:var(--mut);font-size:18px;width:40px;height:40px}

#t-time{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;min-width:110px}#t-label{flex:1;font-weight:700;font-size:16px}
#timer .btn{min-width:48px;padding:8px}

// ===================== Semana y día lógico =====================
function weekInfo(dateS) {
  const st = S.settings; const diff = diffDays(st.anchorDate, dateS);
  const block = Math.floor(diff / 7); const type = (block % 2 === 0) ? st.anchorType : (st.anchorType === 'laboral' ? 'descanso' : 'laboral');
  const dayIn = ((diff % 7) + 7) % 7 + 1;
  return { type, dayIn, block, blockStart: addDays(st.anchorDate, block * 7) };
}
// En semana laboral tu día va de 12:00 pm a 11:59 am del día siguiente; en descanso cambia a las 4:00 am.
function logicalDate(now = new Date()) {
  const a = dstr(new Date(now.getTime() - 12 * 3600000));
  if (weekInfo(a).type === 'laboral') return a;
  return dstr(new Date(now.getTime() - 4 * 3600000));
}
function today() { return logicalDate(); }
function day(ds) {
  if (!S.days[ds]) S.days[ds] = { food: [], water: 0, steps: 0, sleepH: null, napMin: null, stress: null, habits: {}, mood: null, workout: false };
  return S.days[ds];
}
function timeToDate(ds, t, type) {
  const [h, m] = t.split(':').map(Number); const base = dparse(ds);
  if (type === 'laboral' && h < 12) base.setDate(base.getDate() + 1);
  base.setHours(h, m, 0, 0); return base;
}
const typeName = t => t === 'laboral' ? 'Semana laboral nocturna' : 'Semana de descanso';
const typeShort = t => t === 'laboral' ? 'Laboral' : 'Descanso';
const sessKeyFor = dayIn => (dayIn % 2 === 1 ? 'A' : 'B');
const mealTime = (type, k) => (SCHEDULE[type].find(x => x.k === k) || {}).t;
const mealsByTime = type => MEAL_ORDER.slice().sort((a, b) => SCHEDULE[type].findIndex(x => x.k === a) - SCHEDULE[type].findIndex(x => x.k === b));

// ===================== Cálculos =====================
function calc(w) {
  const st = S.settings;
  const bmr = 10 * w + 6.25 * st.height - 5 * st.age + 5;
  const tdee = bmr * 1.375;
  const target = Math.max(1500, Math.ceil((tdee - 500) / 50) * 50);
  const p = st.protein, f = st.fat; const c = (target - p * 4 - f * 9) / 4;
  return { bmr, tdee, target, p, f, c, deficit: tdee - target };
}
const bmi = w => w / Math.pow(S.settings.height / 100, 2);
const bmiCat = b => b < 18.5 ? 'Bajo peso' : b < 25 ? 'Saludable' : b < 30 ? 'Sobrepeso' : b < 35 ? 'Obesidad grado I' : b < 40 ? 'Obesidad grado II' : 'Obesidad grado III';
function latestWeight() { const w = [...S.weights].sort((a, b) => a.date < b.date ? -1 : 1); return w.length ? w[w.length - 1].kg : S.settings.startWeight; }
function sortedWeights() { return [...S.weights].sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0); }
function totals(ds) { const f = day(ds).food; return { kcal: f.reduce((a, x) => a + x.kcal, 0), p: f.reduce((a, x) => a + x.p, 0) }; }
function mealTotals(m) { return { kcal: m.items.reduce((a, x) => a + x[1], 0), p: m.items.reduce((a, x) => a + x[2], 0) }; }
function sleepTotal(d) { if (d.sleepH == null && d.napMin == null) return null; return (d.sleepH || 0) + (d.napMin || 0) / 60; }
const sleepGoal = type => type === 'laboral' ? 6.5 : 7.5;
const stepsGoal = type => type === 'laboral' ? S.settings.stepsL : S.settings.stepsD;
const hmTxt = h => { const t = Math.round(h * 60); return `${Math.floor(t / 60)} h ${pad(t % 60)} min`; };

function autoHabits(ds) {
  const d = day(ds), w = weekInfo(ds); const sl = sleepTotal(d);
  return { sueno: sl != null && sl >= sleepGoal(w.type), agua: d.water >= S.settings.waterGoal, pasos: d.steps >= stepsGoal(w.type), entreno: !!d.workout };
}
function habitList(type) { return [...HABITS.common, ...HABITS[type]]; }
function habitScore(ds) {
  const w = weekInfo(ds); const d = S.days[ds]; if (!d) return { done: 0, total: habitList(w.type).length }; const auto = autoHabits(ds);
  const list = habitList(w.type); let done = 0; list.forEach(h => { if (h.auto ? auto[h.id] : d.habits[h.id]) done++; });
  return { done, total: list.length };
}
function streak() {
  let s = 0; let ds = today(); const sc0 = habitScore(ds);
  if (sc0.done < 5) ds = addDays(ds, -1); // hoy todavía cuenta si aún no terminas
  for (let i = 0; i < 400; i++) { const sc = habitScore(ds); if (sc.done >= 5) { s++; ds = addDays(ds, -1); } else break; }
  return s;
}
function bikeProgress(ds) {
  // número de semanas de descanso ya terminadas desde que empezaste
  const st = S.settings; let n = 0; const w = weekInfo(ds);
  for (let b = w.block - 1; b >= 0; b--) { const bs = addDays(st.anchorDate, b * 7); if (bs < addDays(st.startDate, -6)) break; if (weekInfo(bs).type === 'descanso') n++; }
  return { longMin: Math.min(45, 35 + 2 * n), intervals: Math.min(6, 4 + n), n };
}

// ===================== Gráficas SVG =====================
function lineChart({ series, yMin, yMax, refs = [], xMin, xMax, xLabels, h = 190 }) {
  const W = 340, H = h, L = 34, R = 10, T = 12, B = 24;
  const all = series.flatMap(s => s.pts);
  if (!all.length) return '<div class="empty">Todavía no hay datos para graficar.</div>';
  xMin = xMin ?? Math.min(...all.map(p => p.x)); xMax = xMax ?? Math.max(...all.map(p => p.x)); if (xMax === xMin) { xMax = xMin + 1; }
  yMin = yMin ?? Math.min(...all.map(p => p.y), ...refs.map(r => r.y)); yMax = yMax ?? Math.max(...all.map(p => p.y), ...refs.map(r => r.y)); if (yMax === yMin) { yMax += 1; yMin -= 1; }
  const X = x => L + (x - xMin) / (xMax - xMin) * (W - L - R); const Y = y => T + (1 - (y - yMin) / (yMax - yMin)) * (H - T - B);
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = yMin + (yMax - yMin) * i / 4; g += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" class="grid"/><text x="${L - 4}" y="${Y(v) + 4}" class="axis" text-anchor="end">${Math.round(v * 10) / 10}</text>`; }
  refs.forEach(r => { g += `<line x1="${L}" x2="${W - R}" y1="${Y(r.y)}" y2="${Y(r.y)}" class="ref"/><text x="${W - R}" y="${Y(r.y) - 4}" class="axis ref-t" text-anchor="end">${esc(r.label)}</text>`; });
  (xLabels || []).forEach((l, i, arr) => { const an = arr.length > 1 && i === 0 ? 'start' : arr.length > 1 && i === arr.length - 1 ? 'end' : 'middle'; g += `<text x="${X(l.x)}" y="${H - 6}" class="axis" text-anchor="${an}">${esc(l.t)}</text>`; });
  series.forEach(s => {
    if (!s.pts.length) return; const pts = s.pts.map(p => `${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join(' ');
    g += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" ${s.dash ? 'stroke-dasharray="5 4"' : ''}/>`;
    if (!s.noDots) s.pts.forEach(p => { g += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="3.2" fill="${s.color}"/>`; });
  });

   <div class="list">${miles.map(([kg, l]) => `<div class="li"><span>${cw <= kg ? '✅' : '⬜'} ${l}</span><b>${fmt1(kg)} kg</b></div>`).join('')}</div></div>
  ${m0 && m1 && m0 !== m1 ? `<div class="card"><h3>Medidas: inicio vs ahora</h3><div class="list">${['cintura', 'pecho', 'brazo'].filter(k => m0[k] && m1[k]).map(k => `<div class="li"><span>${k[0].toUpperCase() + k.slice(1)}</span><span>${m0[k]} → ${m1[k]} cm</span><b>${m1[k] - m0[k] > 0 ? '+' : ''}${fmt1(m1[k] - m0[k])}</b></div>`).join('')}</div></div>` : ''}
  <div class="card"><h3>Logros</h3><div class="ach">${ach.map(([e, l, ok]) => `<div class="a ${ok ? 'on' : ''}"><span>${e}</span><small>${l}</small></div>`).join('')}</div></div>
  <div class="card"><div class="row sb"><h3>📷 Fotos (opcional)</h3><label class="btn sm">+ Foto<input type="file" accept="image/*" capture="environment" id="photo-in" hidden></label></div>
   <p class="hint">Se guardan comprimidas solo en tu celular. Tómalas cada 4 semanas, con la misma luz y la misma pose.</p><div id="photos" class="photos"></div></div>`;
}

// ===== Fotos en IndexedDB (también solo en tu celular; localStorage es muy chico para imágenes) =====
function idb() { return new Promise((res, rej) => { const r = indexedDB.open('miplan-fotos', 1); r.onupgradeneeded = () => r.result.createObjectStore('fotos', { keyPath: 'id' }); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function photoAll() { try { const db = await idb(); return await new Promise(res => { const q = db.transaction('fotos').objectStore('fotos').getAll(); q.onsuccess = () => res(q.result || []); q.onerror = () => res([]); }); } catch (e) { return []; } }
async function photoPut(o) { const db = await idb(); return new Promise((res, rej) => { const t = db.transaction('fotos', 'readwrite'); t.objectStore('fotos').put(o); t.oncomplete = res; t.onerror = () => rej(t.error); }); }
async function photoDel(id) { const db = await idb(); return new Promise(res => { const t = db.transaction('fotos', 'readwrite'); t.objectStore('fotos').delete(id); t.oncomplete = res; }); }
async function loadPhotos() {
  const el = $('#photos'); if (!el) return; const ps = (await photoAll()).sort((a, b) => a.date < b.date ? -1 : 1);
  el.innerHTML = ps.length ? ps.map(p => `<figure><img src="${p.data}" alt="Foto ${p.date}" data-act="viewphoto" data-arg="${p.id}"><figcaption>${shortDate(p.date)}${p.kg ? ' · ' + fmt1(p.kg) + ' kg' : ''}</figcaption></figure>`).join('') : '<div class="empty">Sin fotos todavía.</div>';
}
function compress(file) {
  return new Promise((res, rej) => { const img = new Image(); const url = URL.createObjectURL(file); img.onload = () => { const max = 720; let { width: w, height: h } = img; const k = Math.min(1, max / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k); const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.7)); }; img.onerror = rej; img.src = url; });
}

// ===================== Ajustes / onboarding =====================
function setupHtml(first) {
  const st = S.settings; const w = weekInfo(today());
  return `<h2>${first ? 'Bienvenido a tu plan' : 'Ajustes'}</h2>
  <div class="warn">⚕️ ${DISCLAIMER}</div>
  <h4>Tu semana</h4><p class="hint">La app alterna sola: una semana laboral nocturna y una de descanso.</p>
  <div class="form"><label class="span2">¿Qué semana estás viviendo hoy?<select id="s-type" class="inp"><option value="laboral" ${w.type === 'laboral' ? 'selected' : ''}>Semana laboral nocturna</option><option value="descanso" ${w.type === 'descanso' ? 'selected' : ''}>Semana de descanso</option></select></label>
  <label class="span2">¿Qué día empezó esta semana?<input id="s-start" type="date" class="inp" value="${w.blockStart}"></label></div>
  ${first ? '' : `<h4>Metas</h4><div class="form"><label>Vasos de agua<input id="s-water" type="number" class="inp" value="${st.waterGoal}"></label><label>Edad<input id="s-age" type="number" class="inp" value="${st.age}"></label><label>Pasos laboral<input id="s-sl" type="number" class="inp" value="${st.stepsL}"></label><label>Pasos descanso<input id="s-sd" type="number" class="inp" value="${st.stepsD}"></label><label>Peso inicial<input id="s-w0" type="number" step="0.1" class="inp" value="${st.startWeight}"></label><label>Meta (kg)<input id="s-goal" type="number" step="0.1" class="inp" value="${st.goalWeight}"></label></div>
  <p class="hint">Sube los pasos 500 cada 2 semanas: laboral hasta 8,000 y descanso hasta 10,000.</p>`}
  <button class="btn big full" data-act="${first ? 'finishsetup' : 'savesettings'}">${first ? 'Entendido, empezar' : 'Guardar ajustes'}</button>
  ${first ? '' : `<h4>Respaldo</h4><p class="hint">Tus datos viven solo en este celular. Si borras datos del navegador o cambias de celular, se pierden. Descarga un respaldo de vez en cuando.</p>
  <div class="row g8"><button class="btn ghost grow" data-act="export">⬇ Descargar respaldo</button><label class="btn ghost grow">⬆ Restaurar<input type="file" accept="application/json,.json" id="import-in" hidden></label></div>
  ${deferredPrompt ? '<button class="btn full mt8" data-act="install">📲 Instalar app</button>' : ''}
  <button class="btn danger-btn full mt12" data-act="wipe">Borrar todos mis datos</button>`}`;
}
function applyWeek() {
  const type = $('#s-type').value; const t = dstr(new Date()); let start = $('#s-start').value || t; if (start > t) start = t;
  const b = Math.floor(diffDays(start, t) / 7);
  S.settings.anchorDate = start; S.settings.anchorType = (b % 2 === 0) ? type : (type === 'laboral' ? 'descanso' : 'laboral');
}

// ===================== Recordatorios (notificaciones locales) =====================
let remTimers = [];
function scheduleReminders() {
  remTimers.forEach(clearTimeout); remTimers = [];
  if (!S.settings.notif || !('Notification' in window) || Notification.permission !== 'granted') return;
  const now = Date.now(); const ds = today();
  [ds, addDays(ds, 1)].forEach(dd => { const w = weekInfo(dd); SCHEDULE[w.type].forEach(x => { const at = timeToDate(dd, x.t, w.type).getTime(); const ms = at - now; if (ms > 0 && ms < 26 * 3600000) remTimers.push(setTimeout(() => notify(x, dd), ms)); }); });
}
async function notify(x, dd) {
  const w = weekInfo(dd); const m = MENU[w.dayIn][x.k]; const body = m ? `${m.name} · ${mealTotals(m).kcal} kcal` : x.txt;
  try { const reg = await navigator.serviceWorker?.getRegistration(); if (reg) reg.showNotification(`${x.icon} ${x.txt}`, { body, icon: 'icon-192.png', badge: 'icon-192.png', tag: x.k }); else new Notification(`${x.icon} ${x.txt}`, { body }); } catch (e) { }
}

// ===================== Eventos =====================
function logMenu(key) {
  const ds = today(); const d = day(ds); const ex = d.food.find(f => f.menu === key);
  if (ex) { d.food = d.food.filter(f => f !== ex); toast('Quitado'); }
  else { const [n, k] = key.split('-'); const m = MENU[n][k]; const mt = mealTotals(m); d.food.push({ id: uid(), menu: key, name: `${MEAL_LABEL[k]}: ${m.name}`, kcal: mt.kcal, p: mt.p, time: hm12(`${pad(new Date().getHours())}:${pad(new Date().getMinutes())}`) }); toast(`+${mt.kcal} kcal · ${mt.p} g`); }
  save(); render();
}
function nowTime() { const n = new Date(); return hm12(`${pad(n.getHours())}:${pad(n.getMinutes())}`); }
const ACT = {
  tab: a => { tab = a; window.scrollTo(0, 0); render(); },
  goto: a => { tab = a; window.scrollTo(0, 0); render(); },
  water: a => { const d = day(today()); d.water = Math.max(0, d.water + Number(a)); save(); render(); },
  steps: a => { const d = day(today()); d.steps = (d.steps || 0) + Number(a); save(); render(); },
  habit: a => { const d = day(today()); d.habits[a] = !d.habits[a]; save(); render(); },
  menulog: a => logMenu(a),
  comerv: a => { ui.comerView = a; render(); },
  mday: a => { ui.menuDay = Number(a); render(); },
  delf: a => { const d = day(today()); d.food = d.food.filter(f => f.id !== a); save(); render(); },
  addfood: a => { const [m, ...rest] = a.split('|'); const name = rest.join('|'); const f = allFoods().find(x => x[0] === name); if (!f) return; const k = Number(m); day(today()).food.push({ id: uid(), name: (k === 1 ? '' : (k === 0.5 ? '½ de ' : '2 × ')) + f[0], kcal: Math.round(f[1] * k), p: Math.round(f[2] * k), time: nowTime() }); save(); toast(`+${Math.round(f[1] * k)} kcal`); render(); },
  addcustom: () => { const n = $('#c-name').value.trim(), k = Number($('#c-kcal').value), p = Number($('#c-p').value) || 0; if (!n || !k) { toast('Escribe qué comiste y sus kcal'); return; } day(today()).food.push({ id: uid(), name: n, kcal: Math.round(k), p: Math.round(p), custom: true, time: nowTime() }); save(); toast(`+${Math.round(k)} kcal`); render(); },
  addrecent: a => { let f; Object.values(S.days).forEach(d => d.food.forEach(x => { if (x.custom && x.name === a) f = x; })); if (f) { day(today()).food.push({ ...f, id: uid(), time: nowTime() }); save(); toast(`+${f.kcal} kcal`); render(); } },
  shop: a => { S.shop[a] = !S.shop[a]; save(); render(); },
  shopclear: () => { S.shop = {}; save(); render(); },
  savew: () => {
    const date = $('#f-date').value || dstr(new Date()); const kg = parseFloat($('#f-kg').value); const cin = parseFloat($('#f-cin').value), pe = parseFloat($('#f-pe').value), br = parseFloat($('#f-br').value);
    if (!kg && !cin && !pe && !br) { toast('Escribe tu peso o una medida'); return; }
    if (kg) { if (kg < 40 || kg > 250) { toast('Revisa el peso'); return; } S.weights.push({ id: uid(), date, kg }); }
    if (cin || pe || br) S.measures.push({ id: uid(), date, cintura: cin || null, pecho: pe || null, brazo: br || null });
    save(); toast('Guardado'); render();
  },
  delw: a => { if (!confirm('¿Borrar este peso?')) return; S.weights = S.weights.filter(x => x.id !== a); save(); render(); },
  delm: a => { if (!confirm('¿Borrar estas medidas?')) return; S.measures = S.measures.filter(x => x.id !== a); save(); render(); },
  mchart: a => { ui.cuerpoChart = a; render(); },
  recalc: () => { S.settings.calcWeight = latestWeight(); save(); toast(`Nuevo objetivo: ${fmt(calc(S.settings.calcWeight).target)} kcal`); render(); },
  sessv: a => { ui.sessView = a; render(); },
  rest: a => startTimer('rest', [{ s: Number(a), l: 'Descanso' }]),
  bike: a => {
    const ds = today(); const w = weekInfo(ds); const [type, sk] = a.split('|'); const ses = SESS[type][sk]; const bp = bikeProgress(ds); const sl = sleepTotal(day(ds));
    let plan = type === 'descanso' && sk === 'A' ? ses.bike.plan(bp.intervals) : type === 'descanso' && sk === 'B' ? ses.bike.plan(bp.longMin) : ses.bike.plan();
    if (type === 'laboral' && w.type === 'laboral' && sl != null && sl < 4.5) plan = [{ s: 900, l: 'Suave' }];
    startTimer('bike', plan);
  },
  levelup: a => { S.exLevel[a] = Math.min((S.exLevel[a] || 0) + 1, EX[a].levels.length - 1); save(); toast('¡Nivel nuevo! Empieza en el mínimo del rango.'); render(); },
  savesess: a => {
    const ds = today(); const [type, sk] = a.split('|'); const ses = SESS[type][sk]; const dr = getDraft(draftKey(ds, type, sk));
    const ex = {}; ses.ex.forEach(([id, , mn, mx]) => { const r = (dr.reps[id] || []).filter(v => v !== '' && v != null).map(Number); if (r.length) ex[id] = { level: S.exLevel[id] || 0, reps: r, top: mx, full: r.length >= ses.rounds }; });
    // para subir de nivel solo cuentan sesiones con todas las vueltas
    Object.keys(ex).forEach(id => { if (!ex[id].full) ex[id].reps = ex[id].reps.concat([-1]); });
    S.sessions.push({ id: uid(), date: ds, type, sk, ex, bikeMin: Number(dr.bikeMin) || null, effort: Number(dr.effort) || null });
    day(ds).workout = true; delete S.drafts[draftKey(ds, type, sk)]; save(); toast('💪 Entrenamiento guardado'); window.scrollTo(0, 0); render();
  },
  nap: a => { day(today()).napMin = Number(a); save(); render(); },
  remtype: a => { ui.remType = a; render(); },
  notif: async () => {
    if (S.settings.notif) { S.settings.notif = false; save(); scheduleReminders(); render(); return; }
    if (!('Notification' in window)) { toast('Tu navegador no permite avisos'); return; }
    const p = await Notification.requestPermission(); if (p === 'granted') { S.settings.notif = true; save(); scheduleReminders(); toast('Avisos activados'); } else toast('Permiso negado: actívalo en Ajustes de Android'); render();
  },
  month: a => { ui.monthOff += Number(a); render(); },
  ehide: a => { ui.energyHide[a] = !ui.energyHide[a]; render(); },
  viewphoto: async a => { const p = (await photoAll()).find(x => x.id === a); if (!p) return; openModal(`<img src="${p.data}" class="full-img"><p class="hint">${niceDate(p.date)}${p.kg ? ' · ' + fmt1(p.kg) + ' kg' : ''}</p><button class="btn danger-btn full" data-act="delphoto" data-arg="${p.id}">Borrar foto</button>`); },
  delphoto: async a => { if (!confirm('¿Borrar esta foto?')) return; await photoDel(a); closeModal(); loadPhotos(); },
  settings: () => openModal(setupHtml(false)),
  closemodal: () => { if (!S.setup) { toast('Primero elige tu semana'); return; } closeModal(); },
  finishsetup: () => { applyWeek(); S.setup = true; S.settings.startDate = S.settings.anchorDate < today() ? today() : S.settings.anchorDate; save(); try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) { } closeModal(); render(); },
  savesettings: () => {
    applyWeek(); const g = id => parseFloat($(id).value); const st = S.settings;
    if (g('#s-water') > 0) st.waterGoal = g('#s-water'); if (g('#s-age') > 0) st.age = g('#s-age'); if (g('#s-sl') > 0) st.stepsL = g('#s-sl'); if (g('#s-sd') > 0) st.stepsD = g('#s-sd'); if (g('#s-w0') > 0) st.startWeight = g('#s-w0'); if (g('#s-goal') > 0) st.goalWeight = g('#s-goal');
    save(); closeModal(); scheduleReminders(); toast('Ajustes guardados'); render();
  },
  export: () => { const blob = new Blob([JSON.stringify(S)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `respaldo-mi-plan-${dstr(new Date())}.json`; document.body.appendChild(a); a.click(); a.remove(); },
  wipe: () => { if (!confirm('¿Seguro? Se borra todo: pesos, comidas, entrenamientos y registros.')) return; if (!confirm('Última confirmación: esto no se puede deshacer.')) return; localStorage.removeItem(KEY); indexedDB.deleteDatabase('miplan-fotos'); S = defaultState(); closeModal(); render(); openModal(setupHtml(true)); },
  install: async () => { if (!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; closeModal(); },
  tpause: () => pauseTimer(), tstop: () => stopTimer(), tplus: () => { if (timer.mode) { timer.end += 15000; if (timer.paused) timer.left += 15; } }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return; const f = ACT[el.dataset.act]; if (f) { e.preventDefault(); f(el.dataset.arg); }
});
let fqT;
document.addEventListener('input', e => {
  const el = e.target; const k = el.dataset.in; if (!k) return; const ds = today(); const d = day(ds);
  if (k === 'foodq') { ui.foodQ = el.value; clearTimeout(fqT); fqT = setTimeout(() => { const q = ui.foodQ.trim().toLowerCase(); const foods = q.length >= 2 ? allFoods().filter(f => f[0].toLowerCase().includes(q)).slice(0, 12) : []; $('#foodres').innerHTML = foodResults(foods); }, 150); return; }
  if (k === 'stress') { d.stress = Number(el.value); el.closest('.card').querySelector('b').textContent = `${d.stress}/10`; save(); return; }
  if (k === 'mood') { d.mood = d.mood || {}; d.mood[el.dataset.arg] = Number(el.value); el.closest('.slider').querySelector('b').textContent = `${el.value}/10`; save(); return; }
});
document.addEventListener('change', e => {
  const el = e.target; const ds = today(); const d = day(ds);
  if (el.id === 'photo-in' && el.files[0]) { compress(el.files[0]).then(data => photoPut({ id: uid(), date: dstr(new Date()), kg: latestWeight(), data })).then(() => { toast('Foto guardada'); loadPhotos(); }).catch(() => toast('No se pudo guardar la foto')); el.value = ''; return; }
  if (el.id === 'import-in' && el.files[0]) { const r = new FileReader(); r.onload = () => { try { const o = JSON.parse(r.result); if (!o.settings || !o.days) throw 0; if (!confirm('Esto reemplaza tus datos actuales con el respaldo. ¿Continuar?')) return; localStorage.setItem(KEY, JSON.stringify(o)); S = load(); closeModal(); render(); toast('Respaldo restaurado'); } catch (err) { toast('Archivo no válido'); } }; r.readAsText(el.files[0]); return; }
  const k = el.dataset.in; if (!k) return;
  if (k === 'steps') { d.steps = Math.max(0, parseInt(el.value) || 0); save(); render(); }
  else if (k === 'sleepH') { const v = parseFloat(el.value); d.sleepH = isNaN(v) ? null : clamp(v, 0, 16); save(); render(); }
  else if (k === 'napMin') { const v = parseInt(el.value); d.napMin = isNaN(v) ? null : clamp(v, 0, 300); save(); render(); }
  else if (k === 'stress') { render(); }
  else if (k === 'level') { S.exLevel[el.dataset.arg] = Number(el.value); save(); }
  else if (k === 'rep') { const w = weekInfo(ds); const view = ui.sessView || `${w.type}|${sessKeyFor(w.dayIn)}`; const [type, sk] = view.split('|'); const dr = getDraft(draftKey(ds, type, sk)); const [id, r] = el.dataset.arg.split('|'); dr.reps[id] = dr.reps[id] || []; dr.reps[id][Number(r)] = el.value === '' ? '' : Number(el.value); save(); }
  else if (k === 'bikemin' || k === 'effort') { const w = weekInfo(ds); const view = ui.sessView || `${w.type}|${sessKeyFor(w.dayIn)}`; const [type, sk] = view.split('|'); const dr = getDraft(draftKey(ds, type, sk)); dr[k === 'bikemin' ? 'bikeMin' : 'effort'] = el.value; save(); }
});
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal' && S.setup) closeModal(); });

// ===================== PWA =====================
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; });
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) { navigator.serviceWorker.register('./sw.js').catch(() => { }); }
document.addEventListener('visibilitychange', () => { if (!document.hidden) { render(); scheduleReminders(); } });
// Refresca cada minuto para que "lo que sigue" y el día cambien solos
setInterval(() => { if (!document.hidden && !document.activeElement?.matches('input,select,textarea')) render(); }, 60000);

render(); scheduleReminders();
if (!S.setup) openModal(setupHtml(true));

</script>
